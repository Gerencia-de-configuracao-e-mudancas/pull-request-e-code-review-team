    <main>
        <div id="title">
            <h1>Tengo Lengo</h1>
            <span>O sertão Brasileiro tengo lengo tengo lengo</span>
        </div>
        <div>
            <h2 id="titlecategoria">Fauna e Flora!</h2>
            <ul id="itensfaunaeflora">
                <li>
                    <h3 class="itenff">Seriema (Cariama cristata)</h3>
                    <figure>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Pedreira-19_%2841407614112%29.jpg" alt="seriema_src" width="400px" height="400px"/>
                        <figcaption>A seriema é uma ave característica do Sertão Nordestino. Ela tem uma postura ereta e é conhecida por seus gritos que ecoam pela caatinga. Seu comportamento territorial e sua alimentação variada (insetos, pequenos vertebrados e até ovos) são notáveis.
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <h3 class="itenff">Xique-xique (Pilosocereus gounellei)</h3>
                    <figure>
                        <img src="https://tse2.mm.bing.net/th/id/OIP.0EmL3hMJE0aRso8BFyONgAHaFj?rs=1&pid=ImgDetMain&o=7&rm=3" alt="xiqxiq_src" width="400px" height="400px"/>
                        <figcaption>O xique-xique é um cacto típico do Sertão. Ele é adaptado ao clima árido e suas espinhas ajudam a proteger a planta da fauna local. Além disso, suas flores são um atrativo para polinizadores.</figcaption>
                    </figure>
                </li>
                <li>
                    <h3 class="itenff">Braúna (Mimosa caesalpiniifolia)</h3>
                    <figure>
                        <img src="https://th.bing.com/th/id/OIP.2KphKA5w2Ln63zZhE6zpNwHaEs?w=276&h=180&c=7&r=0&o=7&pid=1.7&rm=3" alt="brauna_src" width="400px" height="400px"/>
                        <figcaption>A braúna é uma árvore típica da Caatinga, bastante adaptada ao calor e à seca. Ela tem flores amarelas e pode sobreviver com pouca água. Durante a estação seca, a árvore perde suas folhas, mas é uma importante fonte de alimento para a fauna local.</figcaption>
                    </figure>
                </li>
            </ul>
        </div>
